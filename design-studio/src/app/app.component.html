<div class="nlw-app">

  <header class="nlw-toolbar">
    <div class="toolbar-brand">
      <img src="assets/ai-avatar-toolbar.svg" class="brand-icon" alt="" />
      <span class="brand-name">NLW</span>
      <span class="brand-tagline">Natural Language → Wireframe → Code</span>
    </div>
    <div class="toolbar-actions">
      <span class="version-badge">v{{ version }}</span>
      <span class="stack-badge">Angular · Bootstrap · Material</span>
    </div>
  </header>

  <div class="nlw-panels" [class.canvas-maximized]="isMaximized">

    <!-- Prompt panel -->
    <div class="panel panel-prompt" [class.panel-collapsed]="isMaximized">
      <div class="collapsed-overlay" matRipple (click)="toggleMaximize()">
        <div class="collapsed-card-inner">
          <mat-icon class="collapsed-icon">chat</mat-icon>
          <span class="collapsed-label">Prompt</span>
        </div>
      </div>
      <div class="panel-content">
        <app-prompt-panel />
      </div>
    </div>

    <!-- Canvas (center) -->
    <div class="panel panel-canvas">
      <app-wireframe-canvas
        [isMaximized]="isMaximized"
        (toggleMaximize)="toggleMaximize()" />
    </div>

    <!-- Code panel -->
    <div class="panel panel-code" [class.panel-collapsed]="isMaximized">
      <div class="collapsed-overlay" matRipple (click)="toggleMaximize()">
        <div class="collapsed-card-inner">
          <mat-icon class="collapsed-icon">code</mat-icon>
          <span class="collapsed-label">Code</span>
        </div>
      </div>
      <div class="panel-content">
        <app-code-preview />
        <app-mapping-panel />
      </div>
    </div>

  </div>

</div>

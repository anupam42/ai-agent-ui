<div class="nlw-app">

  <!-- ─── App header ─── -->
  <header class="app-header">
    <div class="ah-left">
      <div class="ah-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 36" width="130" height="36">
          <rect width="36" height="36" rx="8" fill="var(--accent)"/>
          <polyline points="8.5,27 8.5,9.5 18,19.5 27.5,9.5 27.5,27"
            fill="none" stroke="white" stroke-width="3.2"
            stroke-linecap="round" stroke-linejoin="round"/>
          <text x="46" y="20"
            font-family="Inter,system-ui,sans-serif"
            font-weight="700" font-size="15"
            fill="var(--accent)">Mavim</text>
          <text x="47" y="31"
            font-family="Inter,system-ui,sans-serif"
            font-weight="500" font-size="7"
            letter-spacing="2.2"
            fill="var(--text-3)">DESIGN STUDIO</text>
        </svg>
      </div>
      <!-- <nav class="ah-breadcrumb">
        <span>Natural Language</span>
        <mat-icon class="ah-sep">chevron_right</mat-icon>
        <span>Wireframe</span>
        <mat-icon class="ah-sep">chevron_right</mat-icon>
        <span class="ah-active">Code</span>
      </nav> -->
    </div>
    <div class="ah-right">
      <button class="ah-icon-btn" matTooltip="History">
        <mat-icon>history</mat-icon>
      </button>
      <span class="ah-version">v{{ version }}</span>
    </div>
  </header>

  <div class="nlw-panels" [class.canvas-maximized]="isMaximized">

    <!-- Prompt panel -->
    <div class="panel panel-prompt" [class.panel-collapsed]="isMaximized">
      <div class="collapsed-overlay" matRipple (click)="toggleMaximize()">
        <div class="collapsed-card-inner">
          <mat-icon class="collapsed-icon">chat</mat-icon>
          <span class="collapsed-label">Prompt</span>
        </div>
      </div>
      <div class="panel-content">
        <app-prompt-panel />
      </div>
    </div>

    <!-- Canvas (center) -->
    <div class="panel panel-canvas">
      <app-wireframe-canvas
        [isMaximized]="isMaximized"
        [isDark]="isDark"
        (toggleMaximize)="toggleMaximize()"
        (toggleTheme)="toggleTheme()" />
    </div>

    <!-- Code panel -->
    <div class="panel panel-code" [class.panel-collapsed]="isMaximized">
      <div class="collapsed-overlay" matRipple (click)="toggleMaximize()">
        <div class="collapsed-card-inner">
          <mat-icon class="collapsed-icon">code</mat-icon>
          <span class="collapsed-label">Code</span>
        </div>
      </div>
      <div class="panel-content">
        <app-code-preview [isDark]="isDark" />
        <app-mapping-panel />
      </div>
    </div>

  </div>
</div>
